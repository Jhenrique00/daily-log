name: Repository maintenance

on:
  schedule:
    # 06:17 and 20:17 America/Bahia. Each run performs actual checks.
    - cron: '17 9,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'Jhenrique00/daily-log'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate, test and measure
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/audit.py --offline
          else
            python3 scripts/audit.py
          fi
      - name: Publish summary even on failure
        if: always()
        shell: bash
        run: |
          if [[ -f reports/summary.md ]]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit did not produce a report. Inspect the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
