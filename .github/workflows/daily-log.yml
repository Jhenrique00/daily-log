name: Repository maintenance

on:
  schedule:
    # 06:17 and 20:17 America/Bahia. Each run performs actual checks.
    - cron: '17 9,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'Jhenrique00/daily-log'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate, test and measure
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/audit.py --offline
          else
            python3 scripts/audit.py
          fi
      - name: Publish summary even on failure
        if: always()
        shell: bash
        run: |
          if [[ -f reports/summary.md ]]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit did not produce a report. Inspect the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: audit
    if: >-
      github.repository == 'Jhenrique00/daily-log' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
      - name: Prepare and commit verified daily batches
        id: report
        env:
          TZ: America/Bahia
          GIT_AUTHOR_NAME: Jhenrique00 (automated reports)
          GIT_AUTHOR_EMAIL: 172164620+Jhenrique00@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/publish_report.py
      - name: Push the complete batch without rewriting history
        if: steps.report.outputs.publish == 'true'
        run: git push origin HEAD:main
